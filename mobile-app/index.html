<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f4f2ee" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Today's Store Actions: the three things an H&M store manager should act on today." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Today's Store Actions</title>
    <script>
      // Apply the saved or OS theme before first paint to avoid a light flash in dark mode.
      try {
        var t = localStorage.getItem('store-actions-theme')
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
